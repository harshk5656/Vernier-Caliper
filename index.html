<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vernier Pro Industrial</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <h2>Specimen</h2>
        <label>Width (mm)</label>
        <input type="number" id="widthInput" value="32.45" step="0.01">

        <label>Zero Error (mm)</label>
        <input type="range" id="zeroInput" min="-1" max="1" step="0.01" value="0">
        <div id="zeroLabel">0.00 mm</div>

        <button id="applyBtn">Apply</button>
    </aside>

    <main class="viewport">
        <div class="readout" id="readout">0.00 mm</div>
        <canvas id="canvas"></canvas>
    </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
